name: AI DailyPulse

on:
  schedule:
    # Every day at 7:00 PM India Standard Time (IST = UTC+5:30)
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Keep a cache of already-seen URLs so the same story is not reused every day.
      - name: Restore seen URLs cache
        uses: actions/cache@v4
        with:
          path: data/
          key: seen-urls-${{ github.run_id }}
          restore-keys: |
            seen-urls-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily AI Instagram content pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python src/main.py

      - name: Upload Instagram content pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-instagram-ai-content
          path: |
            output/
            data/raw_articles.json
